name: Deploy
on:
  release:
    types:
      - released
jobs:
  deploy:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - name: Install Cross-compilers (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin
      - name: Publish Package
        uses: PyO3/maturin-action@v1
        with:
          command: publish
          # abi3 builds a single cp38-abi3 wheel per platform that runs on Python 3.8+
          args: --username=__token__ ${{ matrix.os == 'ubuntu-latest' && '' || '--no-sdist' }} ${{ !startsWith(matrix.os, 'windows') && '--interpreter=python3.8' || '' }}
        env:
          MATURIN_PASSWORD: ${{ secrets.pypi_password }}
        if: matrix.os != 'macos-latest'
      - name: Publish macOS (x86_64) Package
        if: matrix.os == 'macos-latest'
        uses: PyO3/maturin-action@v1
        with:
          command: publish
          args: --username=__token__ --interpreter=python3.8 --target=x86_64-apple-darwin --no-sdist
        env:
          MATURIN_PASSWORD: ${{ secrets.pypi_password }}
      - name: Publish macOS (arm64) Package
        if: matrix.os == 'macos-latest'
        uses: PyO3/maturin-action@v1
        with:
          command: publish
          args: --username=__token__ --interpreter=python3.8 --target=aarch64-apple-darwin --no-sdist
        env:
          MATURIN_PASSWORD: ${{ secrets.pypi_password }}